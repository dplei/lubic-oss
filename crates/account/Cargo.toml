[package]
name = "lubic-account"
version = "0.1.0"
edition = "2024"
description = "Bilibili account side for lubic: QR login, token refresh, preupload, cover upload, submit. The only crate that touches cookies."
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
form_urlencoded = "1.2"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
