name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 test --workspace --locked
