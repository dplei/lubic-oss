name: Bug 报告
description: 报告可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: Lubic 版本
      description: 填写版本号、镜像标签或提交号。使用 latest 时，尽量提供对应提交号。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 说明运行环境和相关配置。请先去掉账号、Cookie、令牌和个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以附上已脱敏的相关日志。
    validations:
      required: true
