[package]
name = "lubic-controller"
version = "0.1.0"
edition = "2024"
description = "lubic controller: detect live rooms, assign agents, issue upload tickets, submit one archive per live session."
license = "MIT OR Apache-2.0"

[dependencies]
lubic = { path = "../.." }
lubic-account = { path = "../account" }
lubic-events = { path = "../events" }
lubic-proto = { path = "../proto" }
ab_glyph = "0.2"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
humantime = "2.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = "0.13.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
tempfile = "3.14"
