name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 test --workspace --locked

  demo-sync:
    name: Demo sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check demo sync for UI changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qi '^Skip-Demo-Check:'; then
            export SKIP_DEMO_CHECK=1
          fi
          tools/sync-demo.sh --check --base "origin/${{ github.base_ref }}"
